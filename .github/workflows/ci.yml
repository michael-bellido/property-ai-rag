name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      # Informational only — never fails the build. The goal is a signal
      # that lint checks exist, not to block CI on every pre-existing
      # style nit; make it required once the codebase's lint baseline is
      # clean.
      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: ruff check app tests

